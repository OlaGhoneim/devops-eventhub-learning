apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: quay.io/20231232/eventhub-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: CATALOG_URL
              value: http://legacy-catalog:8081
            - name: AUTH_URL
              value: http://auth:8082
            - name: BOOKING_URL
              value: http://booking:8083
            - name: AI_INSIGHT_URL
              value: http://ai-insight:8084
            - name: ANALYTICS_URL
              value: http://analytics:8085
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
