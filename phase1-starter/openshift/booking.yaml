apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      containers:
        - name: booking
          image: quay.io/20231232/eventhub-booking:latest
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: MONGO_URI
              value: mongodb://mongodb:27017
            - name: MONGO_DB
              value: eventhub_bookings
            - name: RABBITMQ_URL
              value: amqp://eventhub:eventhub@rabbitmq:5672/
            - name: RABBITMQ_QUEUE
              value: bookings
            - name: AI_INSIGHT_URL
              value: http://ai-insight:8084
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: booking
spec:
  selector:
    app: booking
  ports:
    - port: 8083
      targetPort: 8083
